name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: "3.3"
          - os: ubuntu-latest
            ruby: "3.4"
          - os: ubuntu-latest
            ruby: "4.0"
          - os: windows-latest
            ruby: "4.0"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Test and lint
        run: bundle exec rake

      - name: Build gem
        run: gem build archunit.gemspec

  rag-fixture:
    name: RAG fixture on Ruby 4.0
    runs-on: ubuntu-latest

    steps:
      - name: Check out ArchUnitRuby
        uses: actions/checkout@v7
        with:
          path: ArchUnitRuby

      - name: Check out the RAG fixture
        uses: actions/checkout@v7
        with:
          repository: TristanKruse/ArchUnitRuby-TestRepo-RAG
          path: ArchUnitRuby-TestRepo-RAG

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ArchUnitRuby-TestRepo-RAG

      - name: Test the RAG fixture against this revision
        run: bundle exec rake
        working-directory: ArchUnitRuby-TestRepo-RAG
