name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compatibility — Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: "3.3"
          - os: ubuntu-latest
            ruby: "3.4"
          - os: windows-latest
            ruby: "4.0"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Test
        run: bundle exec rspec

  quality:
    name: Quality and package — Ruby 4.0 on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Test with coverage
        run: bundle exec rspec
        env:
          COVERAGE: "true"

      - name: Lint
        run: bundle exec rubocop

      - name: Smoke optional framework integrations
        shell: bash
        run: |
          bundle exec ruby -Ilib -e "
            require 'rspec/expectations'
            require 'archunit'
            include RSpec::Matchers
            rule = Class.new {
              include ArchUnit::Checkable
              private
              define_method(:perform_check) { |_options| [] }
            }.new
            expect(rule).to pass
          "
          bundle exec ruby -Ilib -e "
            require 'minitest'
            require 'archunit'
            context_class = Class.new {
              include Minitest::Assertions
              attr_accessor :assertions
            }
            context = context_class.new
            context.assertions = 0
            rule = Class.new {
              include ArchUnit::Checkable
              private
              define_method(:perform_check) { |_options| [] }
            }.new
            context.assert_passes(rule)
            abort unless context.assertions == 1
          "

      - name: Build gem
        run: |
          mkdir -p pkg
          gem build archunit.gemspec --strict --output pkg/archunit.gem

      - name: Install and load the built gem
        shell: bash
        env:
          GEM_HOME: ${{ runner.temp }}/archunit-gem-home
          GEM_PATH: ${{ runner.temp }}/archunit-gem-home
        run: |
          gem install pkg/archunit.gem --no-document
          ruby -e "
            require 'json'
            require 'archunit'
            rules = [
              ArchUnit.project_files.should_not.depend_on_files.in_folder('lib'),
              ArchUnit.project_files.should_not.depend_on_external_modules.matching('json'),
              ArchUnit.project_files.should.adhere_to(
                ->(file) { file.extension == '.rb' }, 'Ruby source required'
              ),
              ArchUnit.project_layers
                .layer('library').defined_by(%r{\Alib/})
                .where_layer('library').may_only_depend_on_layers,
              ArchUnit.project_slices
                .defined_by('lib/(**)/')
                .should_not.contain_dependency('archunit', 'forbidden')
            ]
            abort unless rules.all? { |rule| rule.is_a?(ArchUnit::Checkable) }
            ArchUnit.assert_passes(rules[-2])
            abort unless ArchUnit.format_violations([], color: false) ==
              'No architecture violations found.'
            report = ArchUnit.project_graph
              .include_external_dependencies
              .collapse_to_folder_depth(2)
              .titled('Installed Gem Graph')
            snapshot = report.snapshot
            abort unless snapshot.is_a?(ArchUnit::GraphReportSnapshot)
            payload = JSON.parse(report.to_json)
            abort unless payload.dig('summary', 'node_count') == snapshot.summary.node_count
            abort unless report.to_csv.start_with?('source,target,count,external,import_kinds')
            output = File.join(ENV.fetch('RUNNER_TEMP'), 'archunit-report.html')
            report.export_as_html(output)
            abort unless File.read(output).include?('Generated by ArchUnitRuby')
            slices = ArchUnit.project_slices.defined_by('lib/(**)/')
            plantuml = slices.to_plantuml
            diagram_rule = slices.should.adhere_to_diagram(plantuml)
            ArchUnit.assert_passes(diagram_rule)
            plantuml_output = File.join(ENV.fetch('RUNNER_TEMP'), 'architecture.puml')
            slices.export_as_plantuml(plantuml_output)
            abort unless File.binread(plantuml_output) == plantuml
            puts ArchUnit::VERSION
          "

  rag-fixture:
    name: RAG fixture on Ruby 4.0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out ArchUnitRuby
        uses: actions/checkout@v7
        with:
          path: ArchUnitRuby

      - name: Check out the RAG fixture
        uses: actions/checkout@v7
        with:
          repository: TristanKruse/ArchUnitRuby-TestRepo-RAG
          path: ArchUnitRuby-TestRepo-RAG

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ArchUnitRuby-TestRepo-RAG

      - name: Test the RAG fixture against this revision
        run: bundle exec rake
        working-directory: ArchUnitRuby-TestRepo-RAG
