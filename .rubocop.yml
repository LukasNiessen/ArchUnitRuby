AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3

Layout/LineLength:
  Max: 100

Layout/EndOfLine:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "archunit.gemspec"

Naming/PredicatePrefix:
  AllowedMethods:
    - have_no_cycles
    - have_name
